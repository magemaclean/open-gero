name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        run: pip install -r apps/api/requirements.txt
      - name: Pytest
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web
        working-directory: apps/web
        run: |
          npm install
          npm test
          npm run build
