services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opengero
      POSTGRES_PASSWORD: opengero
      POSTGRES_DB: opengero
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengero"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://opengero:opengero@postgres:5432/opengero
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-opengero}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://web
      DATASETS_DIR: /data/datasets
      TARGETS_DIR: /data/targets
      STORAGE_DIR: /var/opengero/storage
    volumes:
      - storage:/var/opengero/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://opengero:opengero@postgres:5432/opengero
      REDIS_URL: redis://redis:6379/0
      DATASETS_DIR: /data/datasets
      TARGETS_DIR: /data/targets
      STORAGE_DIR: /var/opengero/storage
    volumes:
      - storage:/var/opengero/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NGINX_API_UPSTREAM: api:8000
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  storage:
